name: Build

# main builds the release binary (Linux musl static + macOS) and uploads it as a
# workflow artifact. Tagging a commit `v*.*.*` additionally publishes a GitHub
# Release with the packaged binaries.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/fwext dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          cd dist
          tar -czf fwext-${{ matrix.target }}.tar.gz fwext README.md LICENSE
          shasum -a 256 fwext-${{ matrix.target }}.tar.gz > fwext-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: fwext-${{ matrix.target }}
          path: dist/fwext-${{ matrix.target }}.tar.gz*

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/fwext-*.tar.gz*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
